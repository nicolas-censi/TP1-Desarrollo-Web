<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - El Faro Digital</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="cabecera">
        <div class="barra-superior">
            <span class="fecha">Lunes, 8 de junio de 2026</span>
            <div class="icono-hamburguesa">☰</div>
        </div>
        <div class="logo-diario">
            <h1>EL FARO DIGITAL</h1>
        </div>
        <nav class="menu-navegacion">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Local</a></li>
                <li><a href="#">Economía</a></li>
                <li><a href="#">Tecnología</a></li>
                <li><a href="subscription.html" class="link-suscripcion">Suscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-formulario">
        <h2 id="titulo-bienvenida" class="titulo-formulario">HOLA</h2>
        
        <form id="form-suscripcion" novalidate>
            
            <div class="grupo-control">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre">
                <span id="error-nombre" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <span id="error-email" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
                <span id="error-password" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="repetirPassword">Repetir contraseña:</label>
                <input type="password" id="repetirPassword" name="repetirPassword">
                <span id="error-repetirPassword" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad">
                <span id="error-edad" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono">
                <span id="error-telefono" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion">
                <span id="error-direccion" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad">
                <span id="error-ciudad" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="codigoPostal">Código Postal:</label>
                <input type="text" id="codigoPostal" name="codigoPostal">
                <span id="error-codigoPostal" class="error-mensaje"></span>
            </div>

            <div class="grupo-control">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni">
                <span id="error-dni" class="error-mensaje"></span>
            </div>

            <div class="grupo-boton">
                <button type="submit" id="btn-enviar">Enviar</button>
            </div>

        </form>
    </main>

    <footer class="pie-pagina">
        <p>&copy; 2026 El Faro Digital - Trabajo Práctico 1 - Laboratorio de Desarrollo Web</p>
    </footer>

    <script src="subscription.js" defer></script>
</body>
</html>
